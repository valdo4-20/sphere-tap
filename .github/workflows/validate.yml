name: Validate Journey
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:planet-pack
      - run: node scripts/browser-smoke.mjs
        env:
          DEBUG: pw:api
      - run: npm run test:flows
      - run: npm run test:visual
      - run: npm run audit:questions
      - run: npm run audit:curation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-browser-checks
          path: browser-checks/
          if-no-files-found: ignore
